<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Drafts</title>
<style>
  :root { --bg: #2d2a4a; --card: #3a3660; --ink: #f4f1ff; --muted: #b9b2d8; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 600 16px/1.4 system-ui, sans-serif; padding: 24px 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0 0 20px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .big { width: 180px; height: 180px; border-radius: 40px; image-rendering: pixelated; box-shadow: 0 6px 16px #0006; }
  .row { display: flex; gap: 12px; align-items: center; }
  .small { width: 60px; height: 60px; border-radius: 13px; image-rendering: pixelated; }
  .tiny { width: 32px; height: 32px; border-radius: 7px; image-rendering: pixelated; }
  h2 { margin: 0; font-size: 17px; }
  .card p { margin: 0; font-size: 14px; text-align: center; }
  .home { margin-top: 28px; padding: 24px; border-radius: 24px; background: linear-gradient(135deg, #5b7fd6, #c86fb4); display: flex; flex-wrap: wrap; gap: 22px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #fff; width: 64px; text-align: center; }
  .app canvas { width: 60px; height: 60px; border-radius: 13px; image-rendering: pixelated; }
</style>
</head>
<body>
<h1>Math Quest Legends: icon drafts</h1>
<p>Full-bleed drafts: each icon is the object itself, filling the square. Big, home-screen size, and tiny (browser tab).</p>
<div class="grid" id="grid"></div>
<div class="home" id="home"></div>

<script src="../js/data.js"></script>
<script src="../js/art.js"></script>
<script>
// Tiny 3x5 pixel font for numbers and math signs.
const FONT = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111',
  '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001010010010',
  '8': '111101111101111', '9': '111101111001111', '+': '000010111010000', '=': '000111000111000',
  '-': '000000111000000', 'x': '000101010101000', '?': '111001011000010',
};
function text(ctx, str, x, y, color, s = 1) {
  ctx.fillStyle = color;
  for (const ch of str) {
    const g = FONT[ch];
    if (g) for (let i = 0; i < 15; i++) if (g[i] === '1') ctx.fillRect(x + (i % 3) * s, y + Math.floor(i / 3) * s, s, s);
    x += 4 * s;
  }
}
function rect(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function disc(ctx, cx, cy, r, c) {
  ctx.fillStyle = c;
  for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); ctx.fillRect(cx - w, cy + y, w * 2, 1); }
}
function grass(ctx, n, tall) {
  for (let ty = 0; ty < n; ty++) for (let tx = 0; tx < n; tx++) {
    const ch = tall && ty >= n - 1 ? ',' : (tx + ty) % 3 === 0 ? 'f' : '.';
    ctx.drawImage(Art.tile(ch), tx * 16, ty * 16);
  }
}

// Each draft draws on a small pixel canvas (size = logical pixels), then is scaled up crisply.
// Rounded box drawn pixel by pixel (keeps the pixel-art look).
function rrect(ctx, x, y, w, h, r, c) {
  ctx.fillStyle = c;
  for (let yy = 0; yy < h; yy++) {
    const dy = yy < r ? r - yy - 0.5 : yy >= h - r ? yy - (h - r) + 0.5 : 0;
    const inset = dy ? Math.round(r - Math.sqrt(Math.max(0, r * r - dy * dy))) : 0;
    ctx.fillRect(x + inset, y + yy, w - 2 * inset, 1);
  }
}
function big(ctx, id, x, y, scale = 2) { ctx.drawImage(Art.creature(id), x, y, 48 * scale, 48 * scale); }
function dpad(ctx, x, y, s, c) { rect(ctx, x + s, y, s, s * 3, c); rect(ctx, x, y + s, s * 3, s, c); }

// Full-bleed drafts: the whole icon is the object, cropped to fill the square (like DeckDex).
const DRAFTS = [
  {
    name: 'Current: the three buddies', size: 128,
    note: 'Today\'s icon, for comparison: art floating on a dark square.',
    draw(c) {
      rect(c, 0, 0, 128, 128, '#2d2a4a');
      disc(c, 64, 70, 54, '#4a4566');
      disc(c, 64, 70, 46, '#5b5680');
      c.drawImage(Art.platform(40, 7), 24, 100);
      c.drawImage(Art.creature('sproutle'), 6, 44);
      c.drawImage(Art.creature('splashfin'), 74, 44);
      c.drawImage(Art.creature('emberkit'), 40, 58);
      text(c, '+', 22, 14, '#f2c84b', 4);
      text(c, 'x', 92, 14, '#f2c84b', 4);
    },
  },
  {
    name: 'The handheld', size: 128,
    note: 'The game\'s console fills the icon: screen with your buddy, D-pad and A/B running off the edges.',
    draw(c) {
      rect(c, 0, 0, 128, 128, '#e6e1f0');
      rect(c, 0, 100, 128, 28, '#d9d3e8');
      rrect(c, 8, -24, 112, 104, 22, '#4a4566');
      rect(c, 8, -24, 90, 40, '#4a4566');
      // screen
      const s = document.createElement('canvas'); s.width = 88; s.height = 66;
      const sc = s.getContext('2d');
      for (let y = 0; y < 5; y++) for (let x = 0; x < 6; x++) sc.drawImage(Art.tile(y === 4 ? ',' : (x + y) % 3 === 0 ? 'f' : '.'), x * 16, y * 16 - 14);
      sc.drawImage(Art.platform(26, 6), 18, 50);
      sc.drawImage(Art.creature('sproutle'), 20, 6);
      c.drawImage(s, 20, 0);
      text(c, 'MQ', 50, 70, '#c9c1dc', 2);
      dpad(c, 10, 90, 12, '#2b2840');
      disc(c, 112, 96, 13, '#a8324a'); disc(c, 112, 94, 13, '#e8506a');
      disc(c, 82, 114, 13, '#a8324a'); disc(c, 82, 112, 13, '#e8506a');
    },
  },
  {
    name: 'Switch grips', size: 128,
    note: 'Blue and red grips on the sides, the screen in the middle, like the new sideways layout.',
    draw(c) {
      rect(c, 0, 0, 128, 128, '#2b2840');
      rrect(c, -20, 0, 50, 128, 0, '#1fb4e3');
      rrect(c, 98, 0, 50, 128, 0, '#ff5b4f');
      rect(c, 26, 0, 4, 128, '#178fb8'); rect(c, 98, 0, 4, 128, '#d8443a');
      rrect(c, 34, 14, 60, 100, 8, '#1c1a2b');
      const s = document.createElement('canvas'); s.width = 52; s.height = 84;
      const sc = s.getContext('2d');
      for (let y = 0; y < 6; y++) for (let x = 0; x < 4; x++) sc.drawImage(Art.tile(y >= 5 ? ',' : (x + y) % 3 === 0 ? 'f' : '.'), x * 16, y * 16 - 8);
      sc.drawImage(Art.platform(22, 5), 4, 62);
      sc.drawImage(Art.creature('emberkit'), 2, 20);
      c.drawImage(s, 38, 22);
      dpad(c, 2, 48, 8, '#20202a');
      disc(c, 116, 52, 8, '#2b2840'); disc(c, 108, 70, 8, '#2b2840');
    },
  },
  {
    name: 'Battle screen', size: 128,
    note: 'The icon is a moment from the game: a wild Legend, your buddy, and the math puzzle.',
    draw(c) {
      for (let y = 0; y < 128; y++) rect(c, 0, y, 128, 1, y < 60 ? '#cfeec0' : '#b8e0a0');
      c.drawImage(Art.platform(28, 6), 66, 50);
      c.drawImage(Art.creature('hootsum'), 70, 10);
      c.drawImage(Art.platform(30, 7), 2, 84);
      c.drawImage(Art.creature('sproutle'), 6, 44);
      rrect(c, 4, 6, 54, 16, 3, '#2b2840'); rrect(c, 5, 7, 52, 14, 2, '#fffdf6');
      rect(c, 9, 15, 44, 3, '#c9c1dc'); rect(c, 9, 15, 30, 3, '#5fb84a');
      rect(c, -4, 96, 136, 36, '#2b2840'); rect(c, -4, 99, 136, 33, '#fffdf6');
      text(c, '3+4=?', 20, 104, '#2b2840', 4);
    },
  },
  {
    name: 'Buddy close-up', size: 128,
    note: 'Sproutle so close it fills the icon, leaves poking off the top. Bold and readable at small sizes.',
    draw(c) {
      for (let y = 0; y < 128; y++) rect(c, 0, y, 128, 1, y < 90 ? '#8fd0f0' : '#7cc060');
      for (let i = 0; i < 128; i += 8) rect(c, i, 90, 4, 3, '#6aa848');
      big(c, 'sproutle', -32, -14, 4);
      disc(c, 108, 22, 14, '#2b2840'); disc(c, 108, 22, 12, '#f2c84b');
      rect(c, 105, 13, 6, 18, '#fff'); rect(c, 99, 19, 18, 6, '#fff');
    },
  },
  {
    name: 'Number keypad', size: 128,
    note: 'The in-game keypad up close, with your buddy peeking over the top. Says "math" right away.',
    draw(c) {
      rect(c, 0, 0, 128, 128, '#e8506a');
      rect(c, 0, 0, 128, 44, '#ff8a6a');
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
      keys.forEach((k, i) => {
        const x = -10 + (i % 3) * 52, y = 48 + Math.floor(i / 3) * 34;
        rrect(c, x, y + 4, 44, 28, 7, '#14121f');
        rrect(c, x, y, 44, 28, 7, i === 8 ? '#3fae5a' : '#2b2840');
        text(c, k, x + 16, y + 6, '#fff', 4);
      });
      c.drawImage(Art.creature('sproutle'), 40, 2);
    },
  },
];

function render(d, px) {
  const src = document.createElement('canvas');
  src.width = src.height = d.size;
  const ctx = src.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  d.draw(ctx);
  const out = document.createElement('canvas');
  out.width = out.height = px;
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = false;
  o.drawImage(src, 0, 0, px, px);
  return out;
}
// For saving: MQLIcon(i, 512).toDataURL()
window.MQLIcon = (i, px) => render(DRAFTS[i], px);

const grid = document.getElementById('grid'), home = document.getElementById('home');
DRAFTS.forEach((d, i) => {
  const card = document.createElement('div'); card.className = 'card';
  const big = render(d, 512); big.className = 'big';
  const row = document.createElement('div'); row.className = 'row';
  const sm = render(d, 180); sm.className = 'small';
  const tn = render(d, 64); tn.className = 'tiny';
  row.append(sm, tn);
  const h = document.createElement('h2'); h.textContent = (i + 1) + '. ' + d.name;
  const p = document.createElement('p'); p.textContent = d.note;
  card.append(big, h, row, p);
  grid.append(card);
  const app = document.createElement('div'); app.className = 'app';
  const ic = render(d, 180);
  app.append(ic, Object.assign(document.createElement('span'), { textContent: 'Draft ' + (i + 1) }));
  home.append(app);
});
</script>
</body>
</html>
